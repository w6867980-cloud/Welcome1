<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casino Teen Patti - Unified Wallet Edition</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg-dark: #070a13;
            --card-dark: #0f172a;
            --primary-red: #f43f5e;
            --accent-yellow: #fbbf24;
            --neon-green: #10b981;
            --gray-text: #94a3b8;
            --table-felt: radial-gradient(circle, #054a29 0%, #022313 75%, #011209 100%);
        }

        /* पूरी साइट पर ज़ूमिंग और टेक्स्ट सिलेक्शन बंद करने के लिए नियम */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: var(--bg-dark); 
            color: #f8fafc; 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        
        .main-container { width: 100%; max-width: 480px; }

        /* Header Bar */
        .header-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: rgba(15, 23, 42, 0.8); border-radius: 14px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1); }
        .back-home-btn { background: linear-gradient(135deg, #e11d48, #9f1239); color: white; text-decoration: none; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: bold; }

        /* Live Users Badge */
        .live-online-bar {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 10px;
        }
        .blinking-dot { width: 8px; height: 8px; background: var(--neon-green); border-radius: 50%; animation: blink 1s infinite alternate; }
        @keyframes blink { 0% { opacity: 0.3; } 100% { opacity: 1; } }

        /* Wallet & Status */
        .wallet-card { background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid rgba(251, 191, 36, 0.2); padding: 10px; border-radius: 14px; margin-bottom: 10px; text-align: center; }
        .wallet-amount { font-size: 24px; font-weight: 800; color: var(--accent-yellow); }

        /* Timer Mode Selector */
        .timer-selector { display: flex; gap: 6px; margin-bottom: 10px; justify-content: center; }
        .time-btn { flex: 1; padding: 8px 2px; background: #1e293b; color: var(--gray-text); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; }
        .time-btn.active { background: var(--accent-yellow); color: #000; border-color: var(--accent-yellow); }

        .game-status-card { background: var(--card-dark); padding: 10px 14px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .timer-display { font-size: 20px; font-weight: 800; color: var(--neon-green); }

        /* Casino Table Arena - Enhanced Look */
        .casino-table {
            background: var(--table-felt);
            border: 8px solid #542605;
            outline: 2px solid #fbbf24;
            border-radius: 100px / 50px;
            padding: 20px 10px;
            margin-bottom: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9), inset 0 0 20px rgba(0,0,0,0.8);
            text-align: center;
            position: relative;
            transition: all 0.5s ease;
        }

        .dealer-banner { 
            background: rgba(0,0,0,0.85); 
            border: 1px solid var(--accent-yellow); 
            color: var(--accent-yellow); 
            padding: 6px 16px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: 800; 
            display: inline-block; 
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .cards-board { display: flex; justify-content: space-around; align-items: center; }
        .hand-box { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .hand-label { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 10px; color: white; }
        .label-p { background: #2563eb; }
        .label-d { background: #dc2626; }

        .cards-row { display: flex; gap: 4px; min-height: 54px; align-items: center; perspective: 1000px; }
        
        /* ताश बांटने का रियल एनिमेशन स्टाइल */
        .card-item {
            width: 38px; height: 54px;
            background: #ffffff; color: #111;
            border-radius: 6px; font-weight: 800; font-size: 13px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            transition: transform 0.4s ease, opacity 0.3s ease;
        }

        .card-item.dealing {
            animation: dealCard 0.4s ease-out forwards;
        }

        @keyframes dealCard {
            0% {
                opacity: 0;
                transform: translateY(-80px) scale(0.3) rotate(-20deg);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1) rotate(0deg);
            }
        }

        .card-back {
            background: linear-gradient(135deg, #881337, #4c0519) !important;
            border: 1px solid var(--accent-yellow);
            color: transparent !important;
        }

        /* Live Bets Monitor */
        .live-bets-dashboard { display: flex; gap: 6px; margin-bottom: 10px; }
        .live-bet-box { flex: 1; background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 8px 4px; text-align: center; }
        .live-bet-title { font-size: 9px; color: var(--gray-text); font-weight: bold; }
        .live-bet-val { font-size: 11px; font-weight: 800; color: var(--accent-yellow); margin-top: 2px; }

        /* Bet Options & Chips */
        .patti-btns { display: flex; gap: 6px; margin-bottom: 10px; }
        .patti-btn { flex: 1; padding: 12px 4px; border: none; border-radius: 10px; color: white; font-weight: 800; font-size: 11px; cursor: pointer; }
        .bg-player { background: linear-gradient(135deg, #2563eb, #1e40af); }
        .bg-dealer { background: linear-gradient(135deg, #dc2626, #991b1b); }
        .bg-trail { background: linear-gradient(135deg, #d97706, #78350f); }

        .chip-selector { display: flex; gap: 8px; margin-bottom: 10px; justify-content: center; }
        .chip-btn { width: 44px; height: 44px; background: #1e293b; color: var(--accent-yellow); border: 2px dashed var(--accent-yellow); border-radius: 50%; font-size: 11px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .chip-btn.active { background: var(--accent-yellow); color: #000; border-style: solid; }

        .submit-bet-btn { width: 100%; background: linear-gradient(135deg, #10b981, #059669); color: #fff; font-weight: 800; font-size: 14px; padding: 12px; border: none; border-radius: 10px; cursor: pointer; margin-bottom: 10px; }

        /* Unified History Banner */
        .unified-history-card { background: var(--card-dark); border-radius: 14px; padding: 12px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.08); min-height: 220px; }
        
        .tab-button-group { display: flex; background: rgba(0,0,0,0.5); border-radius: 8px; padding: 3px; gap: 4px; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 8px 4px; font-size: 10px; font-weight: 800; border: none; background: transparent; color: var(--gray-text); border-radius: 6px; cursor: pointer; }
        .tab-btn.active-all { background: #3b82f6; color: #fff; }
        .tab-btn.active-win { background: #10b981; color: #fff; }
        .tab-btn.active-loss { background: #ef4444; color: #fff; }

        .history-table { width: 100%; border-collapse: collapse; font-size: 11px; text-align: center; }
        .history-table th { color: var(--gray-text); padding: 6px 2px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .history-table td { padding: 8px 2px; border-bottom: 1px solid rgba(255,255,255,0.03); }

        .toast-msg { position: fixed; top: 35%; left: 50%; transform: translate(-50%, -50%); background: rgba(5, 8, 17, 0.95); color: #fff; padding: 12px 24px; border-radius: 12px; font-size: 12px; font-weight: bold; z-index: 9999; display: none; text-align: center; border: 1px solid var(--accent-yellow); }
    </style>
</head>
<body>

<div id="toast-box" class="toast-msg"></div>

<div class="main-container">
    <div class="header-bar">
        <div>
            <h4 style="font-size:12px;">👤 <span id="user-phone">गेस्ट यूजर</span></h4>
        </div>
        <a href="index.html" class="back-home-btn">🏠 होम</a>
    </div>

    <div class="live-online-bar">
        <span class="blinking-dot"></span>
        <span>लाइव प्लेयर: <b id="fake-online-count" style="color:#fff;">1,85,420</b> खिलाड़ी</span>
    </div>

    <div class="wallet-card">
        <div style="font-size:9px; color:var(--gray-text); text-transform:uppercase;">कैसीनो वॉलेट बैलेंस</div>
        <div class="wallet-amount">₹<span id="user-balance">0.00</span></div>
    </div>

    <div class="timer-selector">
        <button class="time-btn active" onclick="setTimerMode(20, this)">20s</button>
        <button class="time-btn" onclick="setTimerMode(60, this)">1 Min</button>
        <button class="time-btn" onclick="setTimerMode(120, this)">2 Min</button>
        <button class="time-btn" onclick="setTimerMode(180, this)">3 Min</button>
        <button class="time-btn" onclick="setTimerMode(300, this)">5 Min</button>
    </div>

    <div class="game-status-card">
        <div>
            <div style="font-size:9px; color:var(--gray-text);">पीरियड ID (<span id="mode-label">20s</span>)</div>
            <div style="font-size:12px; font-weight:bold; color:var(--accent-yellow);" id="period-display">2026000001</div>
        </div>
        <div style="text-align:right;">
            <div style="font-size:9px; color:var(--gray-text);">काउंटडाउन</div>
            <div class="timer-display" id="timer-display">00:20</div>
        </div>
    </div>

    <div class="casino-table" id="casino-table">
        <div class="dealer-banner" id="table-status">🎲 PLACE YOUR BETS</div>
        <div class="cards-board">
            <div class="hand-box">
                <span class="hand-label label-p">PLAYER</span>
                <div class="cards-row" id="player-cards">
                    <div class="card-item card-back">🎴</div>
                    <div class="card-item card-back">🎴</div>
                    <div class="card-item card-back">🎴</div>
                </div>
            </div>

            <div style="font-size:14px; font-weight:900; color:var(--accent-yellow);">VS</div>

            <div class="hand-box">
                <span class="hand-label label-d">DEALER</span>
                <div class="cards-row" id="dealer-cards">
                    <div class="card-item card-back">🎴</div>
                    <div class="card-item card-back">🎴</div>
                    <div class="card-item card-back">🎴</div>
                </div>
            </div>
        </div>
    </div>

    <div class="live-bets-dashboard">
        <div class="live-bet-box">
            <div class="live-bet-title">PLAYER BETS</div>
            <div class="live-bet-val" id="fake-p-bet">₹0</div>
        </div>
        <div class="live-bet-box">
            <div class="live-bet-title">TRAIL BETS</div>
            <div class="live-bet-val" id="fake-t-bet">₹0</div>
        </div>
        <div class="live-bet-box">
            <div class="live-bet-title">DEALER BETS</div>
            <div class="live-bet-val" id="fake-d-bet">₹0</div>
        </div>
    </div>

    <div class="patti-btns">
        <button class="patti-btn bg-player" onclick="selectBet('PLAYER')">PLAYER (2X)</button>
        <button class="patti-btn bg-dealer" onclick="selectBet('DEALER')">DEALER (2X)</button>
        <button class="patti-btn bg-trail" onclick="selectBet('TRAIL')">🔥 TRAIL (3X)</button>
    </div>

    <div class="chip-selector">
        <div class="chip-btn active" onclick="setChipAmount(10, this)">₹10</div>
        <div class="chip-btn" onclick="setChipAmount(50, this)">₹50</div>
        <div class="chip-btn" onclick="setChipAmount(100, this)">₹100</div>
        <div class="chip-btn" onclick="setChipAmount(500, this)">₹500</div>
    </div>

    <button class="submit-bet-btn" onclick="placeBet()">🚀 बेट कन्फर्म करें</button>

    <div class="unified-history-card">
        <div class="tab-button-group">
            <button class="tab-btn active-all" id="tab-all" onclick="switchHistoryTab('ALL')">📝 बेट्स (ALL)</button>
            <button class="tab-btn" id="tab-win" onclick="switchHistoryTab('WIN')">🟢 जीत (WIN)</button>
            <button class="tab-btn" id="tab-loss" onclick="switchHistoryTab('LOSS')">🔴 हार (LOSS)</button>
        </div>

        <table class="history-table">
            <thead>
                <tr>
                    <th>समय / मोड</th>
                    <th>बेट विकल्प</th>
                    <th>राशि</th>
                    <th>परिणाम</th>
                </tr>
            </thead>
            <tbody id="unified-history-tbody"></tbody>
        </table>
    </div>
</div>

<script>
    // 🔴 डबल टैप और पिंच ज़ूम को जावास्क्रिप्ट से ब्लॉक करना
    document.addEventListener('touchstart', function (event) {
        if (event.touches.length > 1) {
            event.preventDefault(); // पिंच ज़ूम रोको
        }
    }, { passive: false });

    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (event) {
        let now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
            event.preventDefault(); // डबल टैप ज़ूम रोको
        }
        lastTouchEnd = now;
    }, false);

    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyDUMcJly0ar9hjS8mmkZKizF9fZgwvTz_E",
        authDomain: "double-bang-game.firebaseapp.com",
        databaseURL: "https://double-bang-game-default-rtdb.firebaseio.com",
        projectId: "double-bang-game",
        storageBucket: "double-bang-game.firebasestorage.app",
        messagingSenderId: "1022652972426",
        appId: "1:1022652972426:web:ff7ba6bb61f5a7a78a1c73"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // 🔴 स्टेप 1: लॉग इन यूज़र का नंबर निकालना
    let currentUser = localStorage.getItem('game_current_user') || 'guest_user';
    
    // 🔴 स्टेप 2: मेन वॉलेट की Key को रेफर करना
    let walletRef = db.ref('users/' + currentUser + '/balance');
    let historyRef = db.ref('users/' + currentUser + '/myGameBets');

    let currentBalance = 0;
    let myGameBets = [];
    let activeSelection = null;
    let betAmount = 10;
    let currentHistoryTab = 'ALL';

    let fakePBet = 20, fakeDBet = 20, fakeTBet = 20;
    let gameDuration = 20;
    let cardsRevealed = false;

    function showToast(msg) {
        let t = document.getElementById('toast-box');
        t.innerText = msg;
        t.style.display = 'block';
        setTimeout(() => { t.style.display = 'none'; }, 1500);
    }

    function formatCurrency(num) {
        if (num >= 10000000) return '₹' + (num / 10000000).toFixed(2) + ' Cr';
        if (num >= 100000) return '₹' + (num / 100000).toFixed(2) + ' Lakh';
        return '₹' + num.toLocaleString('en-IN');
    }

    // मेन वॉलेट बैलेंस सिंक
    function initWalletSync() {
        document.getElementById('user-phone').innerText = currentUser;

        walletRef.on('value', (snapshot) => {
            currentBalance = snapshot.val() || 0;
            document.getElementById('user-balance').innerText = currentBalance.toFixed(2);
        });

        historyRef.on('value', (snapshot) => {
            myGameBets = snapshot.val() || [];
            renderHistoryTable();
        });
    }

    // पैसे घटाने का सुरक्षित तरीका
    function deductBetAmount(amount, callback) {
        walletRef.transaction((balance) => {
            if ((balance || 0) >= amount) {
                return balance - amount;
            } else {
                return;
            }
        }, (error, committed) => {
            if (!committed || error) {
                showToast("❌ पर्याप्त बैलेंस नहीं है या एरर आया!");
            } else {
                callback();
            }
        });
    }

    // पैसे बढ़ाने का सुरक्षित तरीका
    function addWinAmount(winAmount) {
        walletRef.transaction((balance) => {
            return (balance || 0) + winAmount;
        });
    }

    function setTimerMode(seconds, el) {
        gameDuration = seconds;
        document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
        if (el) el.classList.add('active');

        let label = seconds >= 60 ? (seconds / 60) + ' Min' : seconds + 's';
        document.getElementById('mode-label').innerText = label;

        cardsRevealed = false;
        hideTableCards();
        renderHistoryTable();
    }

    function setChipAmount(amt, el) {
        betAmount = amt;
        document.querySelectorAll('.chip-btn').forEach(c => c.classList.remove('active'));
        if (el) el.classList.add('active');
    }

    function selectBet(target) {
        activeSelection = target;
        showToast(`चुना गया: ${target}`);
    }

    function placeBet() {
        if (!activeSelection) return showToast('⚠️ कृपया विकल्प चुनें!');

        deductBetAmount(betAmount, () => {
            let period = calculatePeriod();
            let timeLabel = gameDuration >= 60 ? (gameDuration / 60) + 'm' : gameDuration + 's';

            let newBet = {
                period: period,
                mode: timeLabel,
                duration: gameDuration,
                target: activeSelection,
                amount: betAmount,
                status: "पेंडिंग",
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };

            myGameBets.unshift(newBet);
            historyRef.set(myGameBets);

            if(activeSelection === 'PLAYER') fakePBet += betAmount;
            else if(activeSelection === 'DEALER') fakeDBet += betAmount;
            else if(activeSelection === 'TRAIL') fakeTBet += betAmount;

            showToast(`✅ ₹${betAmount} की बेट लग गई! (${timeLabel})`);
        });
    }

    function calculatePeriod() { 
        return "2026" + Math.floor(Date.now() / (gameDuration * 1000)); 
    }

    function updateTimer() {
        let remain = gameDuration - (Math.floor(Date.now() / 1000) % gameDuration);
        let mins = Math.floor(remain / 60);
        let secs = remain % 60;
        let timeString = (mins < 10 ? "0" + mins : mins) + ":" + (secs < 10 ? "0" + secs : secs);
        
        document.getElementById('timer-display').innerText = timeString;
        document.getElementById('period-display').innerText = calculatePeriod();

        if (remain <= 4 && !cardsRevealed) {
            cardsRevealed = true;
            processRoundOutcome(); // पहले विजेता तय करें फिर ताश दिखाएं
        }

        if (remain === gameDuration) {
            cardsRevealed = false;
            fakePBet = 20; fakeDBet = 20; fakeTBet = 20;
            document.getElementById('table-status').innerText = "🎲 PLACE YOUR BETS";
            document.getElementById('table-status').style.color = "var(--accent-yellow)";
            document.getElementById('casino-table').style.borderColor = "#542605";
            hideTableCards();
            renderLiveBetDisplay();
        } else if (remain > 4) {
            let multiplier = (gameDuration - remain) * 350000;
            fakePBet = 20 + Math.floor(multiplier * (1.2 + Math.random()));
            fakeDBet = 20 + Math.floor(multiplier * (1.5 + Math.random()));
            fakeTBet = 20 + Math.floor(multiplier * (0.3 + Math.random()));

            let liveUsers = 150000 + Math.floor(Math.random() * 150000);
            document.getElementById('fake-online-count').innerText = liveUsers.toLocaleString('en-IN');

            renderLiveBetDisplay();
        }
    }

    function renderLiveBetDisplay() {
        document.getElementById('fake-p-bet').innerText = formatCurrency(fakePBet);
        document.getElementById('fake-d-bet').innerText = formatCurrency(fakeDBet);
        document.getElementById('fake-t-bet').innerText = formatCurrency(fakeTBet);
    }

    function hideTableCards() {
        document.getElementById('player-cards').innerHTML = `<div class="card-item card-back">🎴</div><div class="card-item card-back">🎴</div><div class="card-item card-back">🎴</div>`;
        document.getElementById('dealer-cards').innerHTML = `<div class="card-item card-back">🎴</div><div class="card-item card-back">🎴</div><div class="card-item card-back">🎴</div>`;
    }

    // ताश बांटने का रियल एनिमेशन
    function revealTableCardsWithAnimation(pCards, dCards) {
        let pContainer = document.getElementById('player-cards');
        let dContainer = document.getElementById('dealer-cards');
        
        pContainer.innerHTML = "";
        dContainer.innerHTML = "";

        // एक-एक करके ताश फेंकते हुए एनिमेशन
        for (let i = 0; i < 3; i++) {
            setTimeout(() => {
                let pCardEl = document.createElement('div');
                pCardEl.className = 'card-item dealing';
                pCardEl.innerText = pCards[i];
                pContainer.appendChild(pCardEl);

                let dCardEl = document.createElement('div');
                dCardEl.className = 'card-item dealing';
                dCardEl.innerText = dCards[i];
                dContainer.appendChild(dCardEl);
            }, i * 250); // हर 250ms में ताश का पत्ता खुलेगा
        }
    }

    function processRoundOutcome() {
        let pendingBets = (myGameBets || []).filter(b => b.status === "पेंडिंग" && b.duration === gameDuration);

        // तीनों ऑप्शन्स की कुल बेट्स का हिसाब
        let targetAmounts = { 'PLAYER': 0, 'DEALER': 0, 'TRAIL': 0 };
        
        pendingBets.forEach(b => {
            targetAmounts[b.target] = (targetAmounts[b.target] || 0) + b.amount;
        });

        // सबसे कम बेट वाली साइड जीतेगी (0 बेट सबसे कम होगी)
        let sides = ['PLAYER', 'DEALER', 'TRAIL'];
        sides.sort((a, b) => targetAmounts[a] - targetAmounts[b]);
        
        let winningSide = sides[0];

        // 🔴 विजेता का नाम बोर्ड पर दिखाना
        let statusBanner = document.getElementById('table-status');
        statusBanner.innerText = `🎉 WINNER: ${winningSide}`;
        statusBanner.style.color = "#10b981";

        let tableBox = document.getElementById('casino-table');
        if (winningSide === 'PLAYER') tableBox.style.borderColor = "#2563eb";
        else if (winningSide === 'DEALER') tableBox.style.borderColor = "#dc2626";
        else tableBox.style.borderColor = "#d97706";

        // कार्ड्स जनरेट करें
        let ranks = ['A', 'K', 'Q', 'J', '10', '9', '8'];
        let getRandom = () => ranks[Math.floor(Math.random() * ranks.length)];
        let pCards = [getRandom(), getRandom(), getRandom()];
        let dCards = [getRandom(), getRandom(), getRandom()];

        // यदि TRAIL जीता है तो तीन सेम ताश दिखाएँ
        if (winningSide === 'TRAIL') {
            let trailCard = getRandom();
            pCards = [trailCard, trailCard, trailCard];
        }

        revealTableCardsWithAnimation(pCards, dCards);

        // बेट्स का हिसाब और वॉलेट अपडेट (TRAIL पर 3X दिया जाएगा)
        if (pendingBets.length > 0) {
            pendingBets.forEach(bet => {
                if (bet.target === winningSide) {
                    let winMult = (winningSide === 'TRAIL') ? 3 : 2; // 🔥 Trail पर 3 गुना
                    let winAmt = bet.amount * winMult;
                    addWinAmount(winAmt);
                    bet.status = `जीत (+₹${winAmt})`;
                } else {
                    bet.status = "हार";
                }
            });

            historyRef.set(myGameBets);
        }
    }

    function switchHistoryTab(tabType) {
        currentHistoryTab = tabType;
        document.getElementById('tab-all').className = 'tab-btn' + (tabType === 'ALL' ? ' active-all' : '');
        document.getElementById('tab-win').className = 'tab-btn' + (tabType === 'WIN' ? ' active-win' : '');
        document.getElementById('tab-loss').className = 'tab-btn' + (tabType === 'LOSS' ? ' active-loss' : '');
        renderHistoryTable();
    }

    function renderHistoryTable() {
        let bets = (myGameBets || []).filter(b => b.duration === gameDuration);

        if (currentHistoryTab === 'WIN') {
            bets = bets.filter(b => b.status.includes('जीत'));
        } else if (currentHistoryTab === 'LOSS') {
            bets = bets.filter(b => b.status === 'हार');
        }

        let html = "";
        bets.slice(0, 5).forEach(b => {
            let colorStyle = b.status.includes('जीत') ? 'color:#10b981;font-weight:bold;' : (b.status === 'हार' ? 'color:#ef4444;font-weight:bold;' : 'color:#fbbf24;');
            html += `<tr>
                <td>${b.time} (${b.mode})</td>
                <td><b>${b.target}</b></td>
                <td>₹${b.amount}</td>
                <td style="${colorStyle}">${b.status}</td>
            </tr>`;
        });

        document.getElementById('unified-history-tbody').innerHTML = html || `<tr><td colspan="4" style="color:var(--gray-text); padding:15px;">कोई रिकॉर्ड उपलब्ध नहीं है।</td></tr>`;
    }

    setInterval(updateTimer, 1000);
    window.onload = initWalletSync;
</script>
</body>
</html>
