<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>एडमिन कंट्रोल पैनल - विड्रॉल एवं बैलेंस प्रबंधन</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-dark: #1e293b;
            --accent-yellow: #f1c40f;
            --text-light: #f8fafc;
            --neon-green: #10b981;
            --danger-red: #ef4444;
            --blue-btn: #3b82f6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .admin-container { width: 100%; max-width: 1000px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: var(--card-dark); border-radius: 12px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .header-bar h2 { color: var(--accent-yellow); font-size: 20px; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--card-dark); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .stat-value { font-size: 22px; font-weight: bold; margin-top: 5px; color: var(--neon-green); }

        /* क्विक यूज़र सर्च बॉक्स */
        .user-search-box {
            background: var(--card-dark);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .user-search-box input {
            flex: 1;
            padding: 10px;
            background: #0f172a;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: white;
            outline: none;
        }
        .user-search-box button {
            padding: 10px 15px;
            background: var(--blue-btn);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .search-result { margin-top: 8px; font-size: 14px; color: var(--accent-yellow); font-weight: bold; }

        .table-responsive { overflow-x: auto; background: var(--card-dark); border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); padding: 10px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        th, td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.08); vertical-align: top; }
        th { background: #0f172a; color: var(--accent-yellow); font-size: 13px; }

        .user-balance-badge {
            display: inline-block;
            background: #1e1b4b;
            color: #c7d2fe;
            border: 1px solid #6366f1;
            padding: 3px 7px;
            border-radius: 6px;
            font-size: 11px;
            margin-top: 4px;
            font-weight: bold;
        }

        .btn { padding: 6px 10px; border: none; border-radius: 6px; font-weight: bold; font-size: 11px; cursor: pointer; color: #fff; margin: 2px; }
        .btn-success { background: var(--neon-green); }
        .btn-pending { background: #d97706; }
        .btn-processing { background: var(--blue-btn); }
        .btn-danger { background: var(--danger-red); }
        .btn-msg { background: #8b5cf6; }

        .status-badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .badge-pending { background: #b45309; color: #fff; }
        .badge-processing { background: #1d4ed8; color: #fff; }
        .badge-success { background: #15803d; color: #fff; }
        .badge-rejected { background: #b91c1c; color: #fff; }

        .msg-input { width: 100%; padding: 6px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 11px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="admin-container">
    <div class="header-bar">
        <h2>🛠️ एडमिन विड्रॉल एवं यूज़र बैलेंस कंट्रोल पैनल</h2>
        <span style="font-size: 12px; color: #94a3b8;">पिछले 15 दिनों का रिकॉर्ड</span>
    </div>

    <!-- कुल आँकड़े -->
    <div class="stats-grid">
        <div class="stat-card">
            <div>कुल निकासी अनुरोध</div>
            <div class="stat-value" id="totalRequests">0</div>
        </div>
        <div class="stat-card">
            <div>कुल विड्रॉल रकम</div>
            <div class="stat-value" id="totalAmount">₹0.00</div>
        </div>
    </div>

    <!-- त्वरित यूज़र बैलेंस खोज बॉक्स -->
    <div class="user-search-box">
        <input type="text" id="searchUserPhone" placeholder="किसी भी यूज़र का मोबाइल नंबर दर्ज करें...">
        <button onclick="checkUserBalance()">बैलेंस देखें</button>
    </div>
    <div id="searchResultDisplay" class="search-result"></div>

    <!-- निकासी सूची टेबल -->
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>यूज़र / समय</th>
                    <th>वॉलेट बैलेंस</th>
                    <th>प्रकार एवं विवरण</th>
                    <th>विड्रॉल राशि (₹)</th>
                    <th>स्थिति</th>
                    <th>एक्शन / कंट्रोल</th>
                </tr>
            </thead>
            <tbody id="adminWithdrawTable">
                <tr>
                    <td colspan="6" style="text-align: center; color: #94a3b8;">रिकॉर्ड्स लोड हो रहे हैं...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyDUMcJly0ar9hjS8mmkZKizF9fZgwvTz_E",
      authDomain: "double-bang-game.firebaseapp.com",
      databaseURL: "https://double-bang-game-default-rtdb.firebaseio.com",
      projectId: "double-bang-game",
      storageBucket: "double-bang-game.firebasestorage.app",
      messagingSenderId: "1022652972426",
      appId: "1:1022652972426:web:ff7ba6bb61f5a7a78a1c73",
      measurementId: "G-QKXH27RQQS"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    function loadAdminData() {
        const fifteenDaysAgo = Date.now() - (15 * 24 * 60 * 60 * 1000);

        db.ref('withdrawals').on('value', snapshot => {
            const tbody = document.getElementById('adminWithdrawTable');
            tbody.innerHTML = '';
            
            let totalReq = 0;
            let totalAmt = 0;

            if (!snapshot.exists()) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">कोई भी विड्रॉल डेटा उपलब्ध नहीं है।</td></tr>';
                return;
            }

            snapshot.forEach(child => {
                const key = child.key;
                const data = child.val();

                if (data.timestamp < fifteenDaysAgo) {
                    db.ref('withdrawals/' + key).remove();
                    return;
                }

                totalReq++;
                totalAmt += parseFloat(data.amount || 0);

                let dateStr = new Date(data.timestamp).toLocaleString('hi-IN', {
                    day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
                });

                let detailText = "";
                if (data.type === 'UPI') {
                    detailText = `<b>UPI:</b> ${data.upiId}`;
                } else {
                    let b = data.bankDetails || {};
                    detailText = `<b>${b.bankName || 'Bank'}</b><br>खाता: ${b.accountNumber || '-'}<br>नाम: ${b.accountName || '-'}<br>IFSC: ${b.ifscCode || '-'}`;
                }

                let statusBadge = '';
                let status = data.status || 'Pending';
                
                if (status === 'Success') statusBadge = `<span class="status-badge badge-success">Success ✅</span>`;
                else if (status === 'Processing') statusBadge = `<span class="status-badge badge-processing">Processing ⚙️</span>`;
                else if (status === 'Rejected') statusBadge = `<span class="status-badge badge-rejected">Rejected ❌</span>`;
                else statusBadge = `<span class="status-badge badge-pending">Pending ⏳</span>`;

                // टेबल रो बनाएँ (बैलेंस के लिए स्पैन आईडी 'bal_userID_key' होगी)
                let rowId = `user_bal_${key}`;
                let row = `
                    <tr>
                        <td>
                            <b>📱 ${data.user}</b><br>
                            <small style="color:#64748b;">${dateStr}</small>
                        </td>
                        <td>
                            <div class="user-balance-badge" id="${rowId}">लोड हो रहा है...</div>
                        </td>
                        <td>${detailText}</td>
                        <td style="color:var(--neon-green); font-weight:bold;">₹${parseFloat(data.amount).toFixed(2)}</td>
                        <td>${statusBadge}</td>
                        <td>
                            <button class="btn btn-success" onclick="updateStatus('${key}', 'Success')">Success</button>
                            <button class="btn btn-processing" onclick="updateStatus('${key}', 'Processing')">Processing</button>
                            <button class="btn btn-pending" onclick="updateStatus('${key}', 'Pending')">Pending</button>
                            <button class="btn btn-danger" onclick="rejectAndRefund('${key}', '${data.user}', ${data.amount})">Reject & Refund</button>
                            
                            <div>
                                <input type="text" id="msg_${key}" class="msg-input" placeholder="यूज़र को कारण/मैसेज लिखें...">
                                <button class="btn btn-msg" onclick="sendMessage('${data.user}', '${key}')">मैसेज भेजें</button>
                            </div>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;

                // सीधे यूज़र की आईडी से लाइव बैलेंस प्राप्त करें
                db.ref('users/' + data.user + '/balance').on('value', balSnap => {
                    const currentBal = balSnap.exists() ? parseFloat(balSnap.val()).toFixed(2) : "0.00";
                    const balElement = document.getElementById(rowId);
                    if (balElement) {
                        balElement.innerText = `₹${currentBal}`;
                    }
                });
            });

            document.getElementById('totalRequests').innerText = totalReq;
            document.getElementById('totalAmount').innerText = "₹" + totalAmt.toFixed(2);
        });
    }

    // किसी भी यूज़र का बैलेंस सर्च करने के लिए फ़ंक्शन
    function checkUserBalance() {
        const phone = document.getElementById('searchUserPhone').value.trim();
        const display = document.getElementById('searchResultDisplay');

        if (!phone) {
            alert("⚠️ कृपया एक मोबाइल नंबर दर्ज करें!");
            return;
        }

        db.ref('users/' + phone).once('value', snapshot => {
            if (snapshot.exists()) {
                const user = snapshot.val();
                const bal = parseFloat(user.balance || 0).toFixed(2);
                const played = parseFloat(user.totalPlayed || 0).toFixed(2);
                display.innerHTML = `👤 यूज़र: ${phone} | 💰 वर्तमान बैलेंस: ₹${bal} | 🎮 कुल खेला गया: ₹${played}`;
            } else {
                display.innerHTML = `<span style="color:var(--danger-red);">❌ यह यूज़र डेटाबेस में नहीं मिला।</span>`;
            }
        });
    }

    function updateStatus(key, newStatus) {
        db.ref('withdrawals/' + key).update({
            status: newStatus
        }).then(() => {
            alert(`स्टेटस बदलकर '${newStatus}' कर दिया गया है।`);
        });
    }

    function rejectAndRefund(key, userId, amount) {
        if (!confirm(`क्या आप इस विड्रॉल को रिजेक्ट करके ₹${amount} यूज़र (${userId}) के बैलेंस में वापस क्रेडिट करना चाहते हैं?`)) {
            return;
        }

        db.ref('withdrawals/' + key).update({ status: 'Rejected' });

        db.ref('users/' + userId + '/balance').transaction(currentBalance => {
            return (currentBalance || 0) + parseFloat(amount);
        }, (error, committed) => {
            if (committed) {
                alert(`✅ रिजेक्ट कर दिया गया और ₹${amount} यूज़र के खाते में रिफंड कर दिए गए!`);
            } else {
                alert("⚠️ रिफंड करने में कोई त्रुटि आई: " + error);
            }
        });
    }

    function sendMessage(userId, key) {
        const msgInput = document.getElementById('msg_' + key);
        const message = msgInput.value.trim();

        if (!message) {
            alert("⚠️ कृपया भेजने के लिए संदेश लिखें!");
            return;
        }

        db.ref('users/' + userId + '/notifications').push({
            message: message,
            timestamp: Date.now(),
            read: false
        }).then(() => {
            alert(`✅ यूज़र (${userId}) को संदेश भेज दिया गया है!`);
            msgInput.value = '';
        });
    }

    window.onload = loadAdminData;
</script>
</body>
</html>
