<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>गेम अनलॉक अलर्ट</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #1a1a2e;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: #16213e;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 320px;
    }

    .game-title {
      font-size: 20px;
      margin-bottom: 15px;
    }

    .btn-lock {
      background-color: #e94560;
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-lock:hover {
      background-color: #ff6b6b;
    }

    /* Modal / Popup Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: #0f3460;
      padding: 25px;
      border-radius: 12px;
      max-width: 350px;
      width: 90%;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      border: 1px solid #e94560;
    }

    .modal-box p {
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 20px;
      color: #e0e0e0;
    }

    .btn-close {
      background-color: #00fff5;
      color: #000;
      font-weight: bold;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Game Card -->
  <div class="card">
    <div class="game-title">लेवल 8 (Locked 🔒)</div>
    <button class="btn-lock" onclick="showAlert()">गेम खेलें</button>
  </div>

  <!-- Alert Popup Window -->
  <div class="modal-overlay" id="customAlert">
    <div class="modal-box">
      <p>इस खेल में वित्तीय जोखिम शामिल है और इसकी लत लग सकती है। कृपया जिम्मेदारी से और अपने जोखिम पर खेलें।।पहले अपना लेवल कंप्लीट करें इस गेम में 19+ रिटर्न की पॉलिसी है</p>
      <button class="btn-close" onclick="closeAlert()">ठीक है</button>
    </div>
  </div>

  <script>
    function showAlert() {
      document.getElementById('customAlert').classList.add('active');
    }

    function closeAlert() {
      document.getElementById('customAlert').classList.remove('active');
    }
  </script>

</body>
</html>
