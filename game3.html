<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Helicopter Aviator - Main Wallet Integrated</title>

    <!-- Firebase SDK (v8 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-dark: #04060d;
            --card-dark: #0b1120;
            --accent-gold: #fbbf24;
            --neon-green: #10b981;
            --danger-red: #f43f5e;
            --gray-text: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: #f8fafc; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .main-container { width: 100%; max-width: 480px; }

        /* Header Bar - Removed EID / UID */
        .header-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: rgba(11, 17, 32, 0.95); border-radius: 14px; margin-bottom: 8px; border: 1px solid rgba(251, 191, 36, 0.2); }
        .back-home-btn { background: linear-gradient(135deg, #e11d48, #9f1239); color: white; text-decoration: none; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: bold; }

        /* Live Online Users Card */
        .live-global-card {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.12), rgba(11, 17, 32, 0.9));
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: 12px; padding: 10px 14px; margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center; font-size: 12px;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.1);
        }
        .live-pulse { display: inline-block; width: 8px; height: 8px; background: var(--neon-green); border-radius: 50%; margin-right: 6px; box-shadow: 0 0 8px var(--neon-green); animation: blink 1s infinite alternate; }
        @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }

        /* Wallet Card */
        .wallet-card { background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid rgba(251, 191, 36, 0.3); padding: 10px; border-radius: 14px; margin-bottom: 8px; text-align: center; }
        .wallet-amount { font-size: 24px; font-weight: 800; color: var(--accent-gold); text-shadow: 0 0 10px rgba(251, 191, 36, 0.3); }

        /* Aviator Arena Screen */
        .aviator-arena {
            position: relative;
            width: 100%;
            height: 260px;
            background: radial-gradient(circle at bottom left, #171b30, #030409);
            border-radius: 16px;
            border: 2px solid rgba(251, 191, 36, 0.4);
            overflow: hidden;
            margin-bottom: 8px;
            box-shadow: inset 0 0 35px rgba(0,0,0,0.9), 0 0 15px rgba(251, 191, 36, 0.15);
        }

        canvas { display: block; width: 100%; height: 100%; }

        .multiplier-badge {
            position: absolute;
            top: 38%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 30px rgba(251, 191, 36, 0.9);
            z-index: 10;
        }
        .status-msg {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 13px;
            font-weight: 800;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 10;
        }

        /* Controls Panel */
        .controls-panel {
            background: var(--card-dark);
            padding: 12px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 8px;
        }

        .chip-selector { display: flex; gap: 6px; margin-bottom: 10px; justify-content: center; flex-wrap: wrap; }
        .chip-btn { width: 48px; height: 38px; background: #1e293b; color: var(--accent-gold); border: 2px dashed var(--accent-gold); border-radius: 8px; font-size: 11px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .chip-btn.active { background: var(--accent-gold); color: #000; border-style: solid; box-shadow: 0 0 10px rgba(251, 191, 36, 0.5); }

        .custom-bet-box {
            display: flex;
            align-items: center;
            background: #0f172a;
            border: 2px solid rgba(251, 191, 36, 0.4);
            border-radius: 8px;
            padding: 0 8px;
            width: 120px;
            height: 38px;
        }
        .custom-bet-box span { color: var(--accent-gold); font-weight: bold; font-size: 12px; margin-right: 4px; }
        .custom-bet-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 13px;
            font-weight: bold;
        }

        .action-btns { display: flex; gap: 8px; }
        .btn-bet { flex: 1; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; font-size: 14px; font-weight: 800; padding: 13px; border: none; border-radius: 10px; cursor: pointer; }
        .btn-cashout { flex: 1; background: linear-gradient(135deg, #10b981, #047857); color: white; font-size: 14px; font-weight: 800; padding: 13px; border: none; border-radius: 10px; cursor: pointer; display: none; box-shadow: 0 0 12px rgba(16, 185, 129, 0.5); }

        .live-cashout-feed {
            background: rgba(11, 17, 32, 0.95);
            border-radius: 12px;
            padding: 8px 10px;
            margin-bottom: 8px;
            border: 1px solid rgba(255,255,255,0.08);
            height: 100px;
            overflow: hidden;
        }
        .feed-header { font-size: 10px; color: var(--accent-gold); font-weight: bold; margin-bottom: 4px; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 3px; }
        .feed-item { display: flex; justify-content: space-between; font-size: 10px; padding: 3px 0; color: #cbd5e1; border-bottom: 1px dashed rgba(255,255,255,0.03); }

        .unified-history-card { background: var(--card-dark); border-radius: 14px; padding: 12px; border: 1px solid rgba(255,255,255,0.08); min-height: 160px; }
        .tab-button-group { display: flex; background: rgba(0,0,0,0.5); border-radius: 8px; padding: 3px; gap: 4px; margin-bottom: 8px; }
        .tab-btn { flex: 1; padding: 6px 4px; font-size: 10px; font-weight: 800; border: none; background: transparent; color: var(--gray-text); border-radius: 6px; cursor: pointer; }
        .tab-btn.active-all { background: #3b82f6; color: #fff; }
        .tab-btn.active-win { background: #10b981; color: #fff; }
        .tab-btn.active-loss { background: #ef4444; color: #fff; }

        .history-table { width: 100%; border-collapse: collapse; font-size: 11px; text-align: center; }
        .history-table th { color: var(--gray-text); padding: 5px 2px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .history-table td { padding: 7px 2px; border-bottom: 1px solid rgba(255,255,255,0.03); }

        .toast-msg { position: fixed; top: 35%; left: 50%; transform: translate(-50%, -50%); background: rgba(5, 8, 17, 0.95); color: #fff; padding: 12px 24px; border-radius: 12px; font-size: 12px; font-weight: bold; z-index: 9999; display: none; text-align: center; border: 1px solid var(--accent-gold); }
    </style>
</head>
<body>

<div id="toast-box" class="toast-msg"></div>

<div class="main-container">
    <!-- Header Bar without EID / UID -->
    <div class="header-bar">
        <div>
            <h4 style="font-size:12px;">👤 <span id="user-phone">लोड हो रहा है...</span></h4>
        </div>
        <a href="index.html" class="back-home-btn">🏠 होम</a>
    </div>

    <div class="live-global-card">
        <div><span class="live-pulse"></span>लाइव ऑनलाइन यूज़र्स:</div>
        <div><b id="live-online-users" style="color:#fff; font-size:14px;">1,84,320</b></div>
    </div>

    <!-- Connected Wallet Balance -->
    <div class="wallet-card">
        <div style="font-size:9px; color:var(--gray-text); text-transform:uppercase;">मुख्य कैसीनो बैलेंस</div>
        <div class="wallet-amount">₹<span id="user-balance">0.00</span></div>
    </div>

    <!-- Aviator Game Canvas Area -->
    <div class="aviator-arena">
        <canvas id="gameCanvas"></canvas>
        <div class="multiplier-badge" id="multiplier-text">1.00x</div>
        <div class="status-msg" id="status-text">WAITING FOR NEXT ROUND...</div>
    </div>

    <!-- Controls Panel -->
    <div class="controls-panel">
        <div class="chip-selector">
            <div class="chip-btn active" onclick="setBetAmount(10, this)">₹10</div>
            <div class="chip-btn" onclick="setBetAmount(50, this)">₹50</div>
            <div class="chip-btn" onclick="setBetAmount(100, this)">₹100</div>
            <div class="chip-btn" onclick="setBetAmount(500, this)">₹500</div>
            
            <div class="custom-bet-box">
                <span>₹</span>
                <input type="number" id="custom-bet-input" class="custom-bet-input" placeholder="अन्य रकम" min="1" oninput="handleCustomInput(this.value)">
            </div>
        </div>

        <div class="action-btns">
            <button class="btn-bet" id="bet-btn" onclick="placeBet()">🚀 BET (अगले राउंड के लिए)</button>
            <button class="btn-cashout" id="cashout-btn" onclick="cashOut()">💰 CASH OUT (₹0.00)</button>
        </div>
    </div>

    <!-- Live Flight Feed -->
    <div class="live-cashout-feed">
        <div class="feed-header">
            <span>💸 राउंड लाइव बेट्स & जीत (FLIGHT LIVE)</span>
            <span id="flight-status-tag" style="color:var(--gray-text);">WAITING</span>
        </div>
        <div id="cashout-feed-container">
            <div style="font-size:10px; color:var(--gray-text); text-align:center; padding-top:20px;">राउंड शुरू होने की प्रतीक्षा करें...</div>
        </div>
    </div>

    <!-- History Panel -->
    <div class="unified-history-card">
        <div class="tab-button-group">
            <button class="tab-btn active-all" id="tab-all" onclick="switchHistoryTab('ALL')">📝 मेरी बेट्स (ALL)</button>
            <button class="tab-btn" id="tab-win" onclick="switchHistoryTab('WIN')">🟢 जीत (WIN)</button>
            <button class="tab-btn" id="tab-loss" onclick="switchHistoryTab('LOSS')">🔴 हार (LOSS)</button>
        </div>

        <table class="history-table">
            <thead>
                <tr>
                    <th>समय</th>
                    <th>बेट राशि</th>
                    <th>मल्टीप्लायर</th>
                    <th>परिणाम</th>
                </tr>
            </thead>
            <tbody id="unified-history-tbody"></tbody>
        </table>
    </div>
</div>

<script>
    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyDUMcJly0ar9hjS8mmkZKizF9fZgwvTz_E",
        authDomain: "double-bang-game.firebaseapp.com",
        databaseURL: "https://double-bang-game-default-rtdb.firebaseio.com",
        projectId: "double-bang-game",
        storageBucket: "double-bang-game.firebasestorage.app",
        messagingSenderId: "1022652972426",
        appId: "1:1022652972426:web:ff7ba6bb61f5a7a78a1c73",
        measurementId: "G-QKXH27RQQS"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // -------------------------------------------------------------
    // MAIN WALLET INTEGRATION SYSTEM
    // -------------------------------------------------------------
    // 1. Get Logged-in User from localStorage
    let currentUser = localStorage.getItem('game_current_user') || 'guest_user';
    
    // 2. Direct paths to Firebase Main Wallet
    let userRef = db.ref('users/' + currentUser);
    let walletRef = db.ref('users/' + currentUser + '/balance');
    let historyRef = db.ref('users/' + currentUser + '/myGame3Bets');

    let currentBalance = 0;
    let myBetsList = [];
    let selectedBetAmount = 10;

    // Game Variables
    let canvas, ctx;
    let gameState = 'WAITING'; 
    let currentMultiplier = 1.00;
    let targetCrashMultiplier = 2.00;

    let hasActiveBet = false;
    let betPlacedAmount = 0;
    let isCashedOut = false;
    let currentHistoryTab = 'ALL';

    let currentOnlineCount = 184320;

    let copterX = 35;
    let copterY = 200;
    let rotorAngle = 0;

    function showToast(msg) {
        let t = document.getElementById('toast-box');
        t.innerText = msg;
        t.style.display = 'block';
        setTimeout(() => { t.style.display = 'none'; }, 1500);
    }

    // Connect Realtime Wallet
    function initMainWalletConnection() {
        document.getElementById('user-phone').innerText = currentUser;

        // Synchronize Realtime Main Wallet Balance
        walletRef.on('value', (snapshot) => {
            let val = snapshot.val();
            currentBalance = parseFloat(val !== null ? val : 0);
            document.getElementById('user-balance').innerText = currentBalance.toFixed(2);
        });

        // Load History
        historyRef.on('value', (snapshot) => {
            myBetsList = snapshot.val() || [];
            renderHistoryTable();
        });
    }

    function setBetAmount(amt, el) {
        if(hasActiveBet && gameState === 'FLYING') return;
        selectedBetAmount = amt;
        document.getElementById('custom-bet-input').value = ""; 
        document.querySelectorAll('.chip-btn').forEach(c => c.classList.remove('active'));
        if (el) el.classList.add('active');
    }

    function handleCustomInput(val) {
        if(hasActiveBet && gameState === 'FLYING') return;
        let amt = parseFloat(val);
        if(!isNaN(amt) && amt > 0) {
            selectedBetAmount = amt;
            document.querySelectorAll('.chip-btn').forEach(c => c.classList.remove('active'));
        }
    }

    // Deduct Balance Safely via Atomic Transaction
    function placeBet() {
        if (hasActiveBet) return showToast('⚠️ बेट पहले से लगी है!');
        if (!selectedBetAmount || selectedBetAmount <= 0) return showToast('⚠️ मान्य बेट राशि चुनें!');

        walletRef.transaction((bal) => {
            bal = parseFloat(bal || 0);
            if (bal >= selectedBetAmount) {
                return bal - selectedBetAmount;
            } else {
                return; // Abort transaction
            }
        }, (error, committed) => {
            if (error) {
                showToast("⚠️ नेटवर्क एरर!");
            } else if (!committed) {
                showToast("❌ पर्याप्त बैलेंस नहीं है!");
            } else {
                betPlacedAmount = selectedBetAmount;
                hasActiveBet = true;
                isCashedOut = false;

                document.getElementById('bet-btn').innerText = `✅ BET LOCKED (₹${betPlacedAmount})`;
                document.getElementById('bet-btn').style.opacity = "0.6";
                showToast(`✅ ₹${selectedBetAmount} की बेट लग गई!`);
            }
        });
    }

    // Add Winnings to Main Wallet Safely
    function cashOut() {
        if (!hasActiveBet || isCashedOut || gameState !== 'FLYING') return;

        let winAmount = betPlacedAmount * currentMultiplier;

        walletRef.transaction((bal) => {
            return parseFloat(bal || 0) + winAmount;
        });

        isCashedOut = true;

        let newBetRecord = {
            amount: betPlacedAmount,
            multiplier: currentMultiplier.toFixed(2) + 'x',
            status: `जीत (+₹${winAmount.toFixed(2)})`,
            time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
        };

        myBetsList.unshift(newBetRecord);
        historyRef.set(myBetsList);

        addLiveCashoutFeedItem(currentUser.substring(0, 4) + "***", winAmount, currentMultiplier.toFixed(2));

        document.getElementById('cashout-btn').style.display = 'none';
        showToast(`🎉 कैश आउट सफ़ल! +₹${winAmount.toFixed(2)}`);
    }

    function start24x7OnlineEngine() {
        setInterval(() => {
            let change = Math.floor(Math.random() * 35) - 15;
            currentOnlineCount += change;
            document.getElementById('live-online-users').innerText = currentOnlineCount.toLocaleString('en-IN');
        }, 1500);
    }

    function initCanvas() {
        canvas = document.getElementById('gameCanvas');
        ctx = canvas.getContext('2d');
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        drawScene();
    }

    function drawVIPHelicopter(x, y) {
        ctx.save();
        ctx.translate(x, y);

        ctx.shadowBlur = 18;
        ctx.shadowColor = "#fbbf24";

        ctx.fillStyle = "#e11d48";
        ctx.beginPath();
        ctx.ellipse(0, 0, 24, 13, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#fbbf24";
        ctx.fillRect(-10, -3, 18, 4);

        ctx.fillStyle = "#38bdf8";
        ctx.beginPath();
        ctx.arc(10, -2, 7, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#be123c";
        ctx.fillRect(-34, -3, 20, 6);

        ctx.strokeStyle = "#fbbf24";
        ctx.lineWidth = 3;
        ctx.beginPath();
        let bladeWidth = Math.cos(rotorAngle) * 38;
        ctx.moveTo(-bladeWidth, -16);
        ctx.lineTo(bladeWidth, -16);
        ctx.stroke();

        ctx.restore();
    }

    function drawScene() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "rgba(255, 255, 255, 0.04)";
        ctx.lineWidth = 1;
        for (let i = 0; i < canvas.width; i += 30) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        }

        if (gameState === 'FLYING' || gameState === 'CRASHED') {
            ctx.strokeStyle = "#fbbf24";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(30, canvas.height - 30);
            ctx.quadraticCurveTo(copterX / 2, canvas.height - 30, copterX, copterY);
            ctx.stroke();

            drawVIPHelicopter(copterX, copterY);
        } else {
            drawVIPHelicopter(40, canvas.height - 40);
        }
    }

    function calculateCrashPoint() {
        if (hasActiveBet && betPlacedAmount >= 100) {
            return 1.10 + (Math.random() * 0.30);
        } else {
            return 1.30 + Math.pow(Math.random(), 2) * 6.5;
        }
    }

    function addLiveCashoutFeedItem(name, winAmt, mult) {
        let feedBox = document.getElementById('cashout-feed-container');
        let html = `<div class="feed-item">
            <span>👤 ${name}</span>
            <span style="color:var(--neon-green); font-weight:bold;">जीत: ₹${winAmt.toFixed(2)} (${mult}x)</span>
        </div>`;
        feedBox.innerHTML = html + feedBox.innerHTML;
        if (feedBox.children.length > 4) feedBox.removeChild(feedBox.lastChild);
    }

    function handleFlightLiveBets() {
        if (gameState !== 'FLYING') return;

        if (Math.random() < 0.6) {
            let fakePlayers = ['Raju_98', 'Amit_King', 'Kabir_VIP', 'Rohit_Delhi', 'Vipul_Pro', 'Karan_Casino'];
            let pName = fakePlayers[Math.floor(Math.random() * fakePlayers.length)];
            let winVal = Math.floor((Math.random() * 20 + 2) * 50 * currentMultiplier);

            addLiveCashoutFeedItem(pName, winVal, currentMultiplier.toFixed(2));
        }
    }

    function startRound() {
        gameState = 'FLYING';
        currentMultiplier = 1.00;
        copterX = 40;
        copterY = canvas.height - 40;

        targetCrashMultiplier = calculateCrashPoint();

        document.getElementById('status-text').innerText = "HELICOPTER IN AIR...";
        document.getElementById('status-text').style.color = "#10b981";
        document.getElementById('flight-status-tag').innerText = "LIVE TAKEOFF 🚁";
        document.getElementById('flight-status-tag').style.color = "var(--neon-green)";

        document.getElementById('cashout-feed-container').innerHTML = ""; 

        if (hasActiveBet) {
            document.getElementById('bet-btn').style.display = 'none';
            document.getElementById('cashout-btn').style.display = 'block';
        }

        gameLoop();
    }

    function gameLoop() {
        if (gameState !== 'FLYING') return;

        currentMultiplier += 0.008 + (currentMultiplier * 0.002);
        rotorAngle += 0.4;

        if (copterX < canvas.width - 60) copterX += 0.8;
        if (copterY > 45) copterY -= 0.5;

        document.getElementById('multiplier-text').innerText = currentMultiplier.toFixed(2) + 'x';

        if (hasActiveBet && !isCashedOut) {
            let currentWinVal = (betPlacedAmount * currentMultiplier).toFixed(2);
            document.getElementById('cashout-btn').innerText = `💰 CASH OUT (₹${currentWinVal})`;
        }

        drawScene();
        handleFlightLiveBets();

        if (currentMultiplier >= targetCrashMultiplier) {
            triggerCrash();
        } else {
            requestAnimationFrame(gameLoop);
        }
    }

    function triggerCrash() {
        gameState = 'CRASHED';
        document.getElementById('multiplier-text').innerText = currentMultiplier.toFixed(2) + 'x';
        document.getElementById('status-text').innerText = "💥 FLEW AWAY / CRASHED!";
        document.getElementById('status-text').style.color = "#f43f5e";
        document.getElementById('flight-status-tag').innerText = "CRASHED 💥";
        document.getElementById('flight-status-tag').style.color = "var(--danger-red)";

        if (hasActiveBet && !isCashedOut) {
            let newBetRecord = {
                amount: betPlacedAmount,
                multiplier: currentMultiplier.toFixed(2) + 'x',
                status: "हार",
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };

            myBetsList.unshift(newBetRecord);
            historyRef.set(myBetsList);

            showToast('❌ आप कैश आउट नहीं कर पाए!');
        }

        hasActiveBet = false;
        isCashedOut = false;
        document.getElementById('cashout-btn').style.display = 'none';
        document.getElementById('bet-btn').style.display = 'block';
        document.getElementById('bet-btn').innerText = "🚀 BET (अगले राउंड के लिए)";
        document.getElementById('bet-btn').style.opacity = "1";

        setTimeout(() => {
            gameState = 'WAITING';
            document.getElementById('status-text').innerText = "WAITING FOR NEXT ROUND...";
            document.getElementById('status-text').style.color = "#fbbf24";
            document.getElementById('flight-status-tag').innerText = "WAITING";
            document.getElementById('flight-status-tag').style.color = "var(--gray-text)";
            document.getElementById('multiplier-text').innerText = "1.00x";
            drawScene();
            setTimeout(startRound, 3000);
        }, 3500);
    }

    function switchHistoryTab(tabType) {
        currentHistoryTab = tabType;
        document.getElementById('tab-all').className = 'tab-btn' + (tabType === 'ALL' ? ' active-all' : '');
        document.getElementById('tab-win').className = 'tab-btn' + (tabType === 'WIN' ? ' active-win' : '');
        document.getElementById('tab-loss').className = 'tab-btn' + (tabType === 'LOSS' ? ' active-loss' : '');
        renderHistoryTable();
    }

    function renderHistoryTable() {
        let bets = myBetsList || [];

        if (currentHistoryTab === 'WIN') {
            bets = bets.filter(b => b.status && b.status.includes('जीत'));
        } else if (currentHistoryTab === 'LOSS') {
            bets = bets.filter(b => b.status === 'हार');
        }

        let html = "";
        bets.slice(0, 5).forEach(b => {
            let colorStyle = (b.status && b.status.includes('जीत')) ? 'color:#10b981;font-weight:bold;' : 'color:#ef4444;font-weight:bold;';
            html += `<tr>
                <td>${b.time}</td>
                <td>₹${b.amount}</td>
                <td><b>${b.multiplier}</b></td>
                <td style="${colorStyle}">${b.status}</td>
            </tr>`;
        });

        document.getElementById('unified-history-tbody').innerHTML = html || `<tr><td colspan="4" style="color:var(--gray-text); padding:15px;">कोई बेट डेटा उपलब्ध नहीं है।</td></tr>`;
    }

    window.onload = function() {
        initMainWalletConnection();
        initCanvas();
        start24x7OnlineEngine();
        setTimeout(startRound, 2000);
    };
</script>
</body>
</html>
